project_id = "eplivpvqemowmbivhfpx"

[auth]
enabled = true
site_url = "https://noowebr.com"
additional_redirect_urls = [
  "https://noowebr.com/auth/callback",
  "https://noowebr.com/auth/callback?app=restaurant",
  "https://noowebr.com/auth/callback?app=client",
  "https://www.noowebr.com/auth/callback",
  "https://www.noowebr.com/auth/callback?app=restaurant",
  "https://www.noowebr.com/auth/callback?app=client",
  "okinawa-restaurant://auth/callback",
  "noowe://auth/callback",
  "okinawa-restaurant://auth/reset-password",
  "noowe://auth/reset-password",
]

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.send-demo-code]
verify_jwt = false

[functions.verify-demo-code]
verify_jwt = false

[functions.join-table-by-code]
# O usuário é validado dentro da função (admin.auth.getUser); o gateway legado não
# verifica chaves de assinatura assimétricas.
verify_jwt = false

[functions.register-with-resend]
verify_jwt = false

[functions.create-staff-user]
# Authentication and restaurant authorization are validated inside the
# function. Disabling the gateway's legacy JWT check also supports projects
# using asymmetric signing keys.
verify_jwt = false

[functions.send-staff-invite]
# Exige o login de quem convida: restaurant_create_staff_invite roda com o token da pessoa.
verify_jwt = true

[functions.send-push-notification]
# The function additionally requires the service_role claim, but gateway JWT
# verification must remain enabled so that claim cannot be forged.
verify_jwt = true

[functions.payments-create]
# O usuário é validado dentro da função (admin.auth.getUser).
verify_jwt = false

[functions.payments-refund]
# Só o banco chama (pg_net), com a service role; a função confere o papel e o gateway valida o JWT.
verify_jwt = true

[functions.tap-charge]
verify_jwt = true

[functions.tap-webhook]
# O fornecedor chama, sem JWT: quem autentica é a assinatura, na camada do fornecedor.
verify_jwt = false

[functions.billing-charge]
verify_jwt = true

[functions.billing-webhook]
# O Asaas chama, sem JWT: quem autentica é o token do cabeçalho.
verify_jwt = false

[functions.fiscal-emit]
# Só o banco chama (pg_net), com a service role; a função compara o token e o gateway valida o JWT.
verify_jwt = true

[functions.payments-sync]
verify_jwt = false

[functions.payments-account]
# O usuário é validado dentro da função (admin.auth.getUser).
verify_jwt = false

[functions.payments-webhook-asaas]
# Chamado pelo Asaas, sem JWT do Supabase: autenticado pelo token da subconta
# (cabeçalho asaas-access-token comparado com o hash em restaurant_payment_accounts).
verify_jwt = false
