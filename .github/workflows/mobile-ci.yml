name: Mobile CI

on:
  push:
    branches: [main]
    paths: ['platform/mobile/**', 'platform/supabase/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    branches: [main]
    paths: ['platform/mobile/**', 'platform/supabase/**', '.github/workflows/mobile-ci.yml']

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client — lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint:client -- --max-warnings=0
      - run: npm run typecheck:client
      - run: npm run test:client -- --ci

  restaurant:
    name: Restaurant — independent gate
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint:restaurant
      - run: npm run typecheck:restaurant

  supabase:
    name: Supabase — migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/supabase
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: supabase db lint --local --level error
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
